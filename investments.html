<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Investment Holdings - IAY Financial</title>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="icon" type="image/png" href="IAY favicon.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="nav-sidebar.css">
  <link rel="stylesheet" href="transactions.css">
  <link rel="stylesheet" href="investments.css">
</head>
<body data-nav-mode="collapsed" data-nav-page="investments">
  <div class="container">

    <!-- Header with Hamburger Toggle for accounts sidebar -->
    <div class="page-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button id="sidebar-toggle" class="sidebar-toggle" onclick="toggleSidebar()">☰ Accounts</button>
      </div>
    </div>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">

      <!-- Accounts Sidebar -->
      <aside class="accounts-sidebar" id="accounts-sidebar">
        <div class="sidebar-content">
          <div id="accounts-list"></div>
        </div>
      </aside>

      <!-- Main Content Area -->
      <div class="main-content">

        <!-- Filter Strip -->
        <div id="filter-strip" class="filter-strip inv-filter-strip"></div>

        <!-- Action Bar -->
        <div class="action-row">
          <div class="action-row-left">
            <button onclick="syncAllHoldings()">Sync All Holdings</button>
            <div id="status-message" class="status-message"></div>
          </div>
          <div class="action-row-right">
            <div class="export-dropdown-wrapper">
              <button class="secondary" onclick="toggleExportDropdown()">Export ▾</button>
              <div id="export-dropdown" class="export-dropdown" style="display:none;">
                <button onclick="downloadHoldingsCSV(); toggleExportDropdown();">Holdings CSV</button>
                <button onclick="exportHoldingsJSON(); toggleExportDropdown();">Holdings JSON</button>
                <button onclick="exportEtfExposureCSV(); toggleExportDropdown();">ETF Exposure CSV</button>
                <button onclick="copyHoldingsCSV(); toggleExportDropdown();">Copy CSV to Clipboard</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Chart Panel (collapsible) -->
        <div id="chart-panel" class="inv-chart-panel" style="display:none;">
          <div class="inv-chart-header">
            <span>Portfolio Breakdown</span>
            <button class="secondary" onclick="openAllocationSettings()" style="padding:2px 8px; font-size:11px;">⚙ Allocations</button>
            <button class="secondary" onclick="toggleChartPanel()" style="padding:2px 8px; font-size:11px;">Hide</button>
          </div>
          <div class="inv-chart-body">
            <div class="inv-chart-toggle">
              <button id="chart-type-btn" class="btn-chart-toggle active" onclick="switchInvestmentChart('type')">By Type</button>
              <button id="chart-sector-btn" class="btn-chart-toggle" onclick="switchInvestmentChart('sector')">By Sector</button>
              <button id="chart-alloc-btn" class="btn-chart-toggle" onclick="switchInvestmentChart('allocation')">Allocation Drift</button>
            </div>
            <div class="inv-chart-container">
              <canvas id="investment-chart"></canvas>
              <div id="chart-empty-state" class="chart-empty-state">No data for chart</div>
            </div>
          </div>
        </div>

        <!-- Holdings Table -->
        <div class="investment-scroll-pane">
          <div id="table-container">
            <div class="empty-state">Loading investment holdings…</div>
          </div>
        </div>

        <!-- ETF Exposure Panel -->
        <div id="etf-exposure-panel" style="display:none;"></div>

      </div>
    </div>
  </div>

  <!-- Scripts: dependency order -->
  <script src="config.js"></script>
  <script src="date-helpers.js"></script>
  <script src="nav-sidebar.js"></script>
  <!-- Investment modules: state → utils → api → sidebar → filter → table → etf → main -->
  <script src="investments/state.js"></script>
  <script src="investments/utils.js"></script>
  <script src="investments/api.js"></script>
  <script src="investments/accounts-sidebar.js"></script>
  <script src="investments/security-filter.js"></script>
  <script src="investments/holdings-table.js"></script>
  <script src="investments/etf-exposure.js"></script>
  <script src="investments/chart.js"></script>
  <script src="investments/export.js"></script>
  <script src="investments/main.js"></script>
</body>
</html>
