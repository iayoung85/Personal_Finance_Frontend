<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Investment Holdings - IAY Financial</title>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="icon" type="image/png" href="IAY favicon.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="nav-sidebar.css">
  <link rel="stylesheet" href="transactions.css">
  <link rel="stylesheet" href="investments.css">
</head>
<body data-nav-mode="collapsed" data-nav-page="investments">
  <div class="container">

    <!-- Header with Hamburger Toggle for accounts sidebar -->
    <div class="page-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button id="sidebar-toggle" class="sidebar-toggle" onclick="toggleSidebar()">☰ Accounts</button>
      </div>
    </div>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">

      <!-- Accounts Sidebar -->
      <aside class="accounts-sidebar" id="accounts-sidebar">
        <div class="sidebar-content">
          <div id="accounts-list"></div>
        </div>
      </aside>

      <!-- Main Content Area -->
      <div class="main-content">

        <!-- Filter Strip -->
        <div id="filter-strip" class="filter-strip inv-filter-strip"></div>

        <!-- Action Bar -->
        <div class="action-row">
          <div class="action-row-left">
            <button onclick="syncAllHoldings()">Sync All Holdings</button>
            <button class="secondary" onclick="openCsvUploadModal()">📁 Upload CSV</button>
            <button class="secondary" onclick="openAllocationSettings()">⚙ Allocations</button>
            <div id="status-message" class="status-message"></div>
          </div>
          <div class="action-row-right">
            <div class="export-dropdown-wrapper">
              <button class="secondary" onclick="toggleExportDropdown()">Export ▾</button>
              <div id="export-dropdown" class="export-dropdown" style="display:none;">
                <button onclick="downloadHoldingsCSV(); toggleExportDropdown();">Holdings CSV</button>
                <button onclick="downloadHoldingsByAccountCSV(); toggleExportDropdown();">Holdings by Account CSV</button>
                <button onclick="exportHoldingsJSON(); toggleExportDropdown();">Holdings JSON</button>
                <button onclick="exportEtfExposureCSV(); toggleExportDropdown();">ETF Exposure CSV</button>
                <button onclick="copyHoldingsCSV(); toggleExportDropdown();">Copy CSV to Clipboard</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Chart Panel (collapsible) -->
        <div id="chart-panel" class="inv-chart-panel">
          <div class="inv-chart-header">
            <span>Portfolio Breakdown</span>
            <button class="secondary" onclick="toggleChartPanel()" style="padding:2px 8px; font-size:11px;">Hide</button>
          </div>
          <div class="inv-chart-body">
            <div class="inv-chart-toggle">
              <button id="chart-type-btn" class="btn-chart-toggle active" onclick="switchInvestmentChart('type')">By Type</button>
              <button id="chart-sector-btn" class="btn-chart-toggle" onclick="switchInvestmentChart('sector')">By Sector</button>
              <button id="chart-alloc-btn" class="btn-chart-toggle" onclick="switchInvestmentChart('allocation')">Allocation Drift</button>
            </div>
            <div class="inv-chart-container">
              <canvas id="investment-chart"></canvas>
              <div id="chart-empty-state" class="chart-empty-state">No data for chart</div>
              <div id="allocation-drift-table" style="display:none;"></div>
            </div>
          </div>
        </div>

        <!-- Holdings Table -->
        <div class="investment-scroll-pane">
          <div id="table-container">
            <div class="empty-state">Loading investment holdings…</div>
          </div>
        </div>

        <!-- ETF Exposure Panel -->
        <div id="etf-exposure-panel" style="display:none;"></div>

      </div>
    </div>
  </div>

  <!-- ═══ CSV Upload Modal ═══ -->
  <div id="csv-upload-modal" class="assign-modal-overlay" style="display:none;">
    <div class="assign-modal" style="max-width: 560px;">
      <div class="assign-modal-header">
        <h2 id="csv-upload-title">Upload Holdings CSV</h2>
        <button class="assign-modal-close" onclick="closeCsvUploadModal()">✕</button>
      </div>
      <div class="assign-modal-body">
        <!-- Step 1: Select bank and file -->
        <div id="csv-step-select">
          <p style="margin-bottom: 12px; color: var(--text-secondary); font-size: 13px;">
            Select the bank this CSV belongs to, then choose or drag a CSV file exported from your brokerage.
          </p>
          <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px;">Bank</label>
            <select id="csv-bank-select" style="width: 100%; padding: 8px; border: 1px solid var(--border-primary); border-radius: 4px; background: var(--bg-input); color: var(--text-primary); font-size: 13px;">
              <option value="">— Select a bank —</option>
            </select>
          </div>
          <div class="csv-drop-zone" id="csv-drop-zone">
            <input type="file" id="csv-file-input" accept=".csv" onchange="onCsvFileSelected()" style="display: none;">
            <div class="csv-drop-label" id="csv-drop-label">
              <span style="font-size: 24px;">📄</span>
              <span>Drop CSV file here or <a href="#" onclick="event.preventDefault(); document.getElementById('csv-file-input').click();">browse</a></span>
            </div>
          </div>
          <div id="csv-select-error" class="csv-error-text" style="display: none;"></div>
          <div style="display: flex; justify-content: flex-end; margin-top: 12px;">
            <button class="secondary" onclick="closeCsvUploadModal()" style="margin-right: 8px;">Cancel</button>
            <button id="csv-preview-btn" onclick="submitCsvPreview()" disabled>Preview Import</button>
          </div>
        </div>

        <!-- Step 2: Preview results -->
        <div id="csv-step-preview" style="display: none;">
          <div id="csv-preview-content"></div>
          <div id="csv-preview-error" class="csv-error-text" style="display: none;"></div>
          <div style="display: flex; justify-content: flex-end; margin-top: 12px; gap: 8px;">
            <button class="secondary" onclick="csvBackToSelect()">Back</button>
            <button id="csv-import-btn" onclick="submitCsvImport()">Import Holdings</button>
          </div>
        </div>

        <!-- Step 3: Done -->
        <div id="csv-step-done" style="display: none;">
          <div id="csv-done-content"></div>
          <div style="display: flex; justify-content: flex-end; margin-top: 12px;">
            <button onclick="closeCsvUploadModal()">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts: dependency order -->
  <script src="config.js"></script>
  <script src="config-helpers.js"></script>
  <script src="date-helpers.js"></script>
  <script src="nav-sidebar.js"></script>
  <!-- Investment modules: state → utils → api → sidebar → filter → table → etf → main -->
  <script src="investments/state.js"></script>
  <script src="investments/utils.js"></script>
  <script src="investments/api.js"></script>
  <script src="investments/accounts-sidebar.js"></script>
  <script src="investments/security-filter.js"></script>
  <script src="investments/holdings-table.js"></script>
  <script src="investments/etf-exposure.js"></script>
  <script src="investments/chart.js"></script>
  <script src="investments/export.js"></script>
  <script src="investments/main.js"></script>
</body>
</html>
